<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bienvenida</title>
<style>
html,body{
margin:0;height:100%;overflow:hidden;
font-family:Segoe UI,Arial,sans-serif;
background:radial-gradient(circle at 50% 20%,#3f2b74 0,#120a25 45%,#05030b 100%);
}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle linear infinite;}
@keyframes twinkle{
0%,100%{opacity:.15;transform:scale(.8)}
50%{opacity:1;transform:scale(1.4)}
}
.wrap{
position:absolute;inset:0;
display:flex;align-items:center;justify-content:center;
flex-direction:column;text-align:center;padding:24px;
backdrop-filter:blur(1px);
}
h1{
color:#fff;font-size:clamp(34px,6vw,70px);
margin:0 0 20px;
text-shadow:0 0 20px #8a6cff;
animation:fade 1.8s;
}
p{
color:#d9d8ff;
font-size:clamp(18px,2.2vw,28px);
max-width:700px;
line-height:1.5;
animation:fade 2.8s;
}
button{
margin-top:40px;
padding:18px 40px;
border:none;border-radius:999px;
font-size:22px;font-weight:bold;
cursor:pointer;
background:linear-gradient(90deg,#7d5cff,#5ac8ff);
color:white;
box-shadow:0 0 30px rgba(122,92,255,.7);
transition:.25s;
}
button:hover{transform:scale(1.05);}
small{
margin-top:20px;color:#bbb;
}
@keyframes fade{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:none}
}
</style>
</head>
<body>
<script>
for(let i=0;i<180;i++){
 const s=document.createElement('div');
 s.className='star';
 const size=Math.random()*3+1;
 s.style.width=size+'px';
 s.style.height=size+'px';
 s.style.left=Math.random()*100+'vw';
 s.style.top=Math.random()*100+'vh';
 s.style.animationDuration=(2+Math.random()*5)+'s';
 document.body.appendChild(s);
}
const url="https://discord.gg/9AzT9cB3P";
setTimeout(()=>location.href=url,6000);
</script>

<div class="wrap">
<h1>✨ Bienvenida a tu lugar seguro ✨</h1>

<p>
No todos los lugares tienen paredes.<br>
Algunos simplemente se sienten como hogar.
</p>

<button onclick="location.href='https://discord.gg/9AzT9cB3P'">
💜 Entrar
</button>

<small>Entrando automáticamente en unos segundos...</small>
</div>

</body>
</html>
